# Desired promotion-pipeline shape for a target app repo.
# Applied by .github/scripts/seed_promotion_pipelines.py.
#
# The four workflow templates are copied verbatim from scion-testing.
# Per-repo values are repository variables. Constants are identical on
# every app. Project-specific names are created too; real values come
# from resolved_vars once the GCP projects exist, otherwise the
# placeholder below (GitHub rejects an empty variable value).

tiers:
  uat:
    files:
      - { src: templates/workflows/uat-pr-checks.yml, dest: .github/workflows/uat-pr-checks.yml }
      - { src: templates/workflows/uat-promote.yml,   dest: .github/workflows/uat-promote.yml }
    environment: uat
    codeowners_path: "/release/uat/"
    release_keep: templates/release/uat/.gitkeep
    required_checks: [ "uat-checks" ]   # job id in uat-pr-checks.yml

  prod:
    files:
      - { src: templates/workflows/prod-pr-checks.yml, dest: .github/workflows/prod-pr-checks.yml }
      - { src: templates/workflows/prod-promote.yml,   dest: .github/workflows/prod-promote.yml }
    environment: prod
    codeowners_path: "/release/prod/"
    release_keep: templates/release/prod/.gitkeep
    required_checks: [ "prod-checks" ]  # job id in prod-pr-checks.yml

# Removed from the promotion flow; deleted on the target if still present.
retire_files:
  - .github/workflows/prod-open-promotion.yml
  - .github/workflows/prod-merge-on-approval.yml

# Identical on every app — copied from scion-testing.
variables_constant:
  GCP_REGION:      northamerica-northeast1
  DEV_AR_REPO:     apps
  UAT_AR_REPO:     apps-uat
  PROD_AR_REPO:    apps-prod
  ATTESTOR:        build-attestor
  KMS_KEYRING:     binauthz
  KMS_KEY:         attestor-key
  KMS_KEYVERSION:  "1"
  GCRANE_VERSION:  0.20.2
  RUNNER_LABELS:   '["ubuntu-24.04"]'

# Exist on every seeded repo. Real values only after the GCP projects
# exist; pass them in resolved_vars. Until then the placeholder is set.
variables_from_input:
  - DEV_PROJECT_ID
  - UAT_PROJECT_ID
  - PROD_PROJECT_ID
  - PROMOTER_SA
  - UAT_RUNTIME_SA
  - PROD_PROMOTER_SA
  - PROD_RUNTIME_SA
  - WIF_PROVIDER

unset_placeholder: PENDING

repo_settings:
  allow_auto_merge: true
  actions_can_create_and_approve_prs: true
  default_workflow_permissions: read

ruleset:
  name: main-guard
  target_branch: "~DEFAULT_BRANCH"
  block_deletion: true
  block_force_push: true
  require_pull_request: true
  required_approving_reviews: 0
  require_code_owner_review: true
  require_branches_up_to_date: false
  actions_integration_id: 15368
